[project]
name = "python-frameworks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HenningAgge2981", email = "henning.agge@otto.de" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "flet>=0.86.5",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pygame>=2.6.1",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]

[project.scripts]
python-frameworks = "python_frameworks:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
